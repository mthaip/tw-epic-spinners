[build]
  base = "demo"
  command = "yarn --cwd .. install --frozen-lockfile --production=false && yarn --cwd .. demo:build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  YARN_VERSION = "1.22.22"

[context.deploy-preview.environment]
  NUXT_SITE_ENV = "preview"

[context.branch-deploy.environment]
  NUXT_SITE_ENV = "preview"

[dev]
  framework = "#custom"
  command = "yarn dev"
  targetPort = 3001
  port = 8888
